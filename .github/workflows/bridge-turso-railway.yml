# 一次性运维工作流：把 GitHub Secrets 里的 Turso 凭据写入 Railway 服务变量。
# 用完即删——长期同步不靠它，Railway 变量在控制台/CLI 维护。
name: Bridge Turso secrets to Railway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Push Turso variables to Railway service
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$TURSO_DATABASE_URL"
          echo "::add-mask::$TURSO_AUTH_TOKEN"
          railway variables \
            --project ef1cc33e-7a70-42f9-8049-2f4ec2ad1fd8 \
            --environment production \
            --service dshfind-api \
            --set "TURSO_DATABASE_URL=$TURSO_DATABASE_URL" \
            --set "TURSO_AUTH_TOKEN=$TURSO_AUTH_TOKEN" > /dev/null
          echo "Turso variables updated on Railway dshfind-api"
