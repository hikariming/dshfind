# 每日把 GitHub topic dsh-plugin 的仓库指标同步进 Turso，然后刷新构建期的静态快照。
# 手动触发：gh workflow run sync-plugins.yml
name: Sync plugins to Turso

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC = 北京 10:17，避开整点拥堵
  workflow_dispatch:

# 刷新后的静态快照要提交回 main，由此触发 Cloudflare Workers Builds 重新构建。
permissions:
  contents: write

concurrency:
  group: sync-plugins

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 双写通道（docs/d1-migration-plan.md P3）：脚本写库必须同时落 Turso 与 D1，
      # 缺了这两个变量 db.mjs 会降级只写 Turso，D1（前端与 api-edge 的数据源）天天漂移。
      D1_INTERNAL_URL: https://dshfind.com/api/internal/db
      D1_INTERNAL_TOKEN: ${{ secrets.D1_INTERNAL_TOKEN }}
      # api-edge 产物部署用。ACCOUNT_ID 不敏感；API_TOKEN 需要 Workers Scripts:Edit 权限，
      # 未配置时跳过部署并醒目告警（数据仍同步，但桌面端目录会停在旧版）。
      CLOUDFLARE_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # fetch-depth: 0 —— 末尾要 rebase 到最新 main 再推，浅克隆做不了。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --skip-contributors：Actions 的 GITHUB_TOKEN 预算低（1000 次/时），逐仓库抓
      # 贡献者数（1.2 万仓库）必然触发限流退避、20 分钟超时——2026-08-22 起连续四天
      # 的 cancelled 全是这个。夜间只走 search API（约 2 分钟），贡献者数沿用上轮值；
      # 全量重抓留给本地 `pnpm refresh --with-contributors`（个人 token 5000 次/时）。
      - run: pnpm sync:db --skip-contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # 探测安装方式：新收录的仓库 + 超过 7 天没探过的重探（作者可能发布 npm、
      # GitHub Release tarball 或补 prepare）。每个有效 bundle 最多请求一次 Releases API。
      #
      # --deadline 8：Actions 的 GITHUB_TOKEN 只有 1000 次/时，配额一空这步就会
      # 在 120s 退避里耗死，把 20 分钟 job 预算占光——后面的产物生成、边缘部署、
      # 提交推送一步都跑不到（2026-08-27 整轮同步就断在这里）。到点收工，没问到的
      # 行保持旧 probed_at，下一轮自然接着探；全量重探留给本地 pnpm refresh。
      - run: pnpm probe:install --deadline 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # 双写一致性核对：两库任何漂移都在这里红掉，不带着漂移发布产物。
      - name: Verify Turso and D1 stayed consistent
        run: node scripts/check-db-consistency.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # 刷新构建期静态快照。首页三条 rail（编辑推荐/本周飙升/新面孔）与插件页的 DB 兜底
      # 都是构建产物——只同步 Turso 而不重新生成，「飙升」和「新面孔」会永远停在上次
      # 构建时的那批人。必须排在 probe:install 之后：新面孔要求 is_plugin=1，那一列由它写。
      #
      # 只跑 gen:plugins 不跑 gen:data：gen:ranking 用 gh CLI 读 dsh-external/dsh-club，
      # 默认 GITHUB_TOKEN 没有跨仓库权限，排行榜快照仍在本地手工刷新。
      - run: pnpm gen:plugins
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # 桌面端目录由 api-edge Worker 的静态产物服务（不再是 Go 的自刷新快照），
      # 数据同步后必须重发产物，否则桌面端拿到的目录停在上一次发布。
      - name: Generate api-edge catalog artifacts
        run: node scripts/gen-api-artifacts.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy api-edge worker (verify + auto-rollback)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/deploy-api-edge.mjs

      - name: Warn when the api-edge deploy credentials are missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN 未配置，api-edge 产物没有部署——桌面端目录仍是旧版。" \
               "建 Workers Scripts:Edit 权限的 token 后 gh secret set CLOUDFLARE_API_TOKEN"

      - name: Commit refreshed snapshots to trigger a frontend build
        run: |
          set -euo pipefail
          # 生成物头部带「生成时间」注释，每次跑都不同。只有它变说明数据其实没动，
          # 不值得为此提交一次、再触发一次全站构建。
          real_change=$(git diff -U0 -- src/lib \
            | grep '^[-+]' | grep -v '^[-+][-+][-+]' | grep -v '生成时间' || true)
          if [ -z "$real_change" ]; then
            git checkout -- src/lib
            echo "静态快照无实质变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib
          git commit -m "数据同步：刷新插件静态快照与首页 rail"
          # 同步期间可能有人推了 main；rebase 一次再推，仍失败就让本次同步红掉等下一轮，
          # 不强推——生成物冲突强推会盖掉别人的提交。
          git pull --rebase origin main
          git push origin HEAD:main
