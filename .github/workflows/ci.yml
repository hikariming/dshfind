name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow and deployment gate checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # scripts/lib 的单测早已不止「纯函数、零依赖」那几个：db.test.mjs 要
      # @libsql/client、install.test.mjs 要 semver。不装依赖这一步会以
      # ERR_MODULE_NOT_FOUND 常红，把真正的回归淹掉。
      - run: pnpm install --frozen-lockfile
      - name: Unit-test shared script libraries
        run: node --test scripts/lib/*.test.mjs
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # CI 不可使用生产密钥；构建必须能在无 Turso/GitHub 凭据的条件下完成。
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, test, and production build
        run: pnpm ci:frontend
