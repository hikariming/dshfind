# Astro 新站（apps/web → Worker dshfind-web）的发布。
#
# 老站由 Cloudflare Workers Builds 监听仓库自动构建；新站走这里：人推到 main 且改到了
# 新站构建会读取的文件时触发。每日数据同步由 sync-plugins.yml 在同一个 job 里直接发布
# （GITHUB_TOKEN 推的提交不会触发本 workflow）。手动：gh workflow run deploy-web.yml
name: Deploy web (Astro)

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      # 迁移期新站直接读老站 src/ 下的数据快照、课程 MDX、图示、样式与文案
      - src/lib/**
      - src/content/**
      - src/components/diagrams/**
      - src/app/globals.css
      - src/i18n/**
      - messages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

# 排队而不是取消：两次推送都要各自发布到最新
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dshfind/web run check
      # 迁移期：新站 public/ 里的文件在正式域名上由老站提供，缺了就是线上裂图
      - run: node scripts/rewrite/check-public-assets.mjs
      - run: pnpm --filter @dshfind/web run cf:deploy
      # 冒烟：直连新站 workers.dev（不经老站路由器与边缘缓存），确认刚发布的版本在服务
      - name: Smoke test
        run: |
          set -euo pipefail
          base=https://dshfind-web.beiming1201.workers.dev
          # 刚发布完的首个请求偶发 TLS 握手失败（curl 35），重试几次再判定，别让一次抖动把发布标红
          for p in /zh/learn/cordis /en/plugins/c/tools /zh/plugins/all/1 /zh/plugins/fuzz1og/dsh-ocgo-quota /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 3 "$base$p")
            echo "$p -> $code"
            [ "$code" = 200 ] || exit 1
          done
          # 经正式域名（老站路由器 → service binding）再测一次需要服务端取数的页面：
          # Worker 在 zone 上下文里的行为与 workers.dev 直连不同（同 zone 子请求会绕过 Worker），
          # 论坛帖子曾因此全站 404 而 workers.dev 上一切正常
          body=$(curl -s --retry 5 --retry-all-errors --retry-delay 3 -H 'Sec-Fetch-Mode: navigate' https://dshfind.com/zh/bbs)
          echo "$body" | grep -q '/bbs/t/' || { echo "dshfind.com/zh/bbs 没有帖子链接（服务端取论坛 API 失败）"; exit 1; }
          echo "dshfind.com/zh/bbs -> 有帖子链接"
          # 正式页面绝不能带 noindex（静态页、按需渲染页各抽一个）
          for p in /zh/learn/cordis /zh/plugins/fuzz1og/dsh-ocgo-quota; do
            if curl -sI --retry 5 --retry-all-errors --retry-delay 3 "https://dshfind.com$p" | grep -qi '^x-robots-tag:.*noindex'; then
              echo "https://dshfind.com$p 带了 X-Robots-Tag: noindex"; exit 1
            fi
          done
          echo "正式页面无 noindex 头"
