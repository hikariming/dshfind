# 本地 e2e：真实 Turso 数据 + 桌面端市场模拟器。
# 用法（仓库根目录执行）：
#   railway variables -k | grep -E '^TURSO_' > .env.e2e   # 见 server/README.md
#   docker compose -f server/docker-compose.yml up --build --abort-on-container-exit
# marketsim 退出码即测试结果；api 日志里的 stdout span 用于验证 OTel 插桩。
services:
  api:
    build:
      # 与 Railway 一致：build context 是仓库根（server/Dockerfile 里的注释）。
      context: ..
      dockerfile: server/Dockerfile
    env_file: ../.env.e2e
    environment:
      PORT: "8080"
      # e2e 用 stdout exporter 直接打印 span/metric，无需 collector。
      OTEL_EXPORTER_OTLP_ENDPOINT: stdout
      OTEL_SERVICE_NAME: dshfind-api-e2e
    ports:
      - "18080:8080"

  marketsim:
    image: node:22-alpine
    depends_on:
      - api
    volumes:
      - ../scripts/e2e:/e2e:ro
    environment:
      API_BASE: http://api:8080
    command: ["node", "/e2e/market-sim.mjs"]
