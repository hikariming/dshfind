# 根目录：数据管线脚本（scripts/）与新站复用的 src/；apps/web 是 Astro 主站
packages:
  - apps/*
  # api-edge 的 cf 项目清单（cf 要求 wrangler 装在 Worker 自己的 node_modules）
  - workers/api-edge

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: false
  unrs-resolver: false
  # esbuild 是 Vite / wrangler 打 Worker 包用的，必须放行；
  # workerd 的 postinstall 只装本地 dev 用的运行时二进制，构建部署都用不到它。
  esbuild: true
  workerd: false

minimumReleaseAgeExclude:
  # 5.20261019.1-beta、cf、runtime-types：cf CLI（api-edge 迁移到 cf，见
  # workers/api-edge/cloudflare.config.ts）发布不满观察期，只放行这几个精确版本
  - miniflare@5.20260926.1-alpha || 5.20261019.1-beta
  - wrangler@4.144.0
  - cf@1.0.0-beta.20
  - '@cloudflare/runtime-types@0.1.14'
